[project]
name = "chief-shared-types"
version = "0.1.0"
description = "Chief AI Startup OS — Shared types, grounding validator, tier classifier, denylist enforcer"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0.0",
    "google-generativeai>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["chief_types*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
