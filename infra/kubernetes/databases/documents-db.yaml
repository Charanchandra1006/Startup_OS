apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chief-documents-db
  namespace: chief-system
spec:
  serviceName: "chief-documents-db"
  replicas: 1
  selector:
    matchLabels:
      app: chief-documents-db
  template:
    metadata:
      labels:
        app: chief-documents-db
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: chief-config
              key: DOCUMENTS_DB_NAME
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: chief-secrets
              key: DOCUMENTS_DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chief-secrets
              key: DOCUMENTS_DB_PASSWORD
        volumeMounts:
        - name: documents-db-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: documents-db-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: chief-documents-db
  namespace: chief-system
spec:
  selector:
    app: chief-documents-db
  ports:
  - port: 5432
    targetPort: 5432
