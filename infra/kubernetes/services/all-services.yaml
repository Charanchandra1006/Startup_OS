apiVersion: apps/v1
kind: Deployment
metadata:
  name: chief-api-gateway
  namespace: chief-system
  labels:
    app: chief-api-gateway
    tier: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chief-api-gateway
  template:
    metadata:
      labels:
        app: chief-api-gateway
        tier: gateway
    spec:
      containers:
      - name: api-gateway
        image: chief/api-gateway:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: chief-config
        - secretRef:
            name: chief-secrets
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chief-api-gateway
  namespace: chief-system
spec:
  type: LoadBalancer
  selector:
    app: chief-api-gateway
  ports:
  - port: 3000
    targetPort: 3000
---
# ── Orchestrator ──────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chief-orchestrator
  namespace: chief-system
  labels:
    app: chief-orchestrator
    tier: core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chief-orchestrator
  template:
    metadata:
      labels:
        app: chief-orchestrator
        tier: core
    spec:
      containers:
      - name: orchestrator
        image: chief/orchestrator:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: chief-config
        - secretRef:
            name: chief-secrets
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chief-orchestrator
  namespace: chief-system
spec:
  selector:
    app: chief-orchestrator
  ports:
  - port: 8000
    targetPort: 8000
---
