# ── Finance Agent (AGT-FIN) ───────────────────────────────────────────
# SCOPE_MAP entry: ["finance.read"]
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chief-agent-finance
  namespace: chief-system
  labels:
    app: chief-agent-finance
    tier: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chief-agent-finance
  template:
    metadata:
      labels:
        app: chief-agent-finance
        tier: agent
    spec:
      containers:
      - name: agent-finance
        image: chief/agent-finance:latest
        ports:
        - containerPort: 8011
        envFrom:
        - configMapRef:
            name: chief-config
        - secretRef:
            name: chief-secrets
        env:
        - name: TOOL_GATEWAY_URL
          value: "http://chief-tool-gateway.chief-system.svc.cluster.local:8002"
        resources:
          requests:
            cpu: 150m
            memory: 192Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8011
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: agent-finance
  namespace: chief-system
spec:
  selector:
    app: chief-agent-finance
  ports:
  - port: 8011
    targetPort: 8011
