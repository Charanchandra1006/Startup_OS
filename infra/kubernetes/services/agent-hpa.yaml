# Chief AI Startup OS — HorizontalPodAutoscaler for Agent Services
# Implements: STARTUP_OS_MASTER_BUILD_PLAN Part 7.3
#
# Agents are the most bursty workload — a single goal can dispatch 5 agents
# concurrently. HPA targets 70% CPU utilization with 1-3 replicas per agent.
# The orchestrator and tool-gateway are already at replicas: 2 (static) which
# is sufficient for Phase 1 volume; they get HPAs in Phase 2.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-agent-finance
  namespace: chief-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chief-agent-finance
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
